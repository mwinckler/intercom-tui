[package]
name = "intercom-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A portable Intercom inbox for your terminal"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
fs2 = "0.4"
futures = "0.3"
pulldown-cmark = "0.13"
rand = "0.9"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18", default-features = false, features = ["z-with-tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
mac-notification-sys = "0.6.15"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
